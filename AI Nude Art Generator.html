<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Nude Art Generator</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f0f0; padding: 20px; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1);}
        input, button, textarea { width: 100%; margin-bottom: 10px; padding: 10px; border-radius: 5px; border: 1px solid #ccc; }
        #preview { margin-top: 10px; max-width: 100%; }
    </style>
</head>
<body>

<div class="container">
    <h1>AI Nude Art Generator</h1>
    <form id="aiForm">
        <label>Upload Your Image:</label>
        <input type="file" id="imageUpload" accept="image/*" required>

        <label>Describe the Art Style (Prompt):</label>
        <textarea id="prompt" placeholder="e.g., 'artistic nude portrait, soft light, oil painting style'" required></textarea>

        <button type="submit">Generate Art</button>
    </form>

    <img id="preview" src="" alt="AI Output will appear here">

</div>

<script>
document.getElementById('aiForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const fileInput = document.getElementById('imageUpload');
    const promptInput = document.getElementById('prompt');
    const outputImage = document.getElementById('preview');

    if (!fileInput.files[0]) {
        alert("Please upload an image first!");
        return;
    }

    const formData = new FormData();
    formData.append('image', fileInput.files[0]);
    formData.append('prompt', promptInput.value);

    // ตัวอย่าง: สมมติส่งข้อมูลไปยัง API ที่ทำ style transfer หรือ AI generation
    try {
        const response = await fetch('https://your-ai-backend.com/generate', {
            method: 'POST',
            body: formData
        });

        if (!response.ok) throw new Error('AI Generation Failed!');

        const data = await response.json();
        outputImage.src = data.generated_image_url;
    } catch (error) {
        alert(error.message);
    }
});
</script>

</body>
</html>
